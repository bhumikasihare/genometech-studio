name: Keep All GenomeTech Streamlit Portals Awake

on:
  schedule:
    - cron: '0 */8 * * *' # Runs automatically every 8 hours
  workflow_dispatch:      # Lets you run it manually from the Actions tab anytime

jobs:
  wake-all-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit and Wake All 7 Streamlit Apps
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://genometech-client-app.streamlit.app/",
              "https://genomics-dashboard-jc7w8ehgobjbw5mvrwunvu.streamlit.app/",
              "https://bhumika-rnaseq.streamlit.app/",
              "https://genometech-tier4.streamlit.app/",
              "https://genometech-tier5.streamlit.app/",
              "https://genometech-checkout.streamlit.app/",
              "https://microtool-omics.streamlit.app/"
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for url in URLS:
                  try:
                      page = browser.new_page()
                      print(f"Checking {url}...")
                      page.goto(url, timeout=60000)
                      page.wait_for_timeout(6000)

                      # If the app is asleep, click the wake-up button
                      btn = page.locator("button:has-text('Yes, get this app back up')")
                      if btn.count() > 0:
                          print(f"Waking up {url}...")
                          btn.first.click()
                          page.wait_for_timeout(25000)
                      else:
                          print(f"{url} is already awake!")
                      page.close()
                  except Exception as e:
                      print(f"Skipped or timed out on {url}: {e}")
              browser.close()
          EOF

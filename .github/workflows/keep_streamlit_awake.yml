name: Keep Streamlit Portals Awake

on:
  schedule:
    - cron: '0 */8 * * *' # Runs automatically every 8 hours
  workflow_dispatch:      # Lets you trigger it manually anytime

jobs:
  wake-apps:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit and Wake All GenomeTech Streamlit Apps
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          URLS = [
              "https://genometech-client-portal.streamlit.app/",
              "https://genometech-checkout.streamlit.app/"
              # Add your Express Tool Streamlit URLs here too!
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              for url in URLS:
                  try:
                      page = browser.new_page()
                      print(f"Checking {url}...")
                      page.goto(url, timeout=60000)
                      page.wait_for_timeout(5000)
                      # If the app is asleep, click the wake-up button!
                      btn = page.locator("button:has-text('Yes, get this app back up')")
                      if btn.count() > 0:
                          print(f"Waking up {url}...")
                          btn.first.click()
                          page.wait_for_timeout(25000)
                      page.close()
                  except Exception as e:
                      print(f"Error on {url}: {e}")
              browser.close()
          EOF
